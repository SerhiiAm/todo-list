{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <div class="card shadow-sm mt-4 mx-auto" style="max-width: 600px;">
    <div class="card-body">
      <h1 class="card-title h3 mb-4">{{ object|yesno:"Update,Create" }} tag</h1>

      <form action="" method="post" novalidate>
        {% csrf_token %}
        {{ form|crispy }}

        <div class="mt-4">
          <input type="submit" value="Submit" class="btn btn-primary mr-2">
          <a href="{% url 'tasks:tag-list' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
