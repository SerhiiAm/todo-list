{% extends "base.html" %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mt-3 mb-4">
    <h1 class="mb-0">Tags</h1>
    <a href="{% url 'tasks:tag-create' %}" class="btn btn-primary">Add</a>
  </div>

  {% if tag_list %}
    <table class="table align-middle">
      <thead>
      <tr>
        <th>Name</th>
        <th>Update</th>
        <th>Delete</th>
      </tr>
      </thead>
      <tbody>
      {% for tag in tag_list %}
        <tr>
          <td class="font-weight-bold text-secondary">
            {{ tag.name }}
          </td>
          <td>
            <a href="{% url 'tasks:tag-update' pk=tag.id %}" class="btn btn-secondary text-white">
              Update
            </a>
          </td>
          <td>
            <a href="{% url 'tasks:tag-delete' pk=tag.id %}" class="btn btn-secondary text-white">
              Delete
            </a>
          </td>
        </tr>
      {% endfor %}
      </tbody>
    </table>

    {% include "includes/pagination.html" %}

  {% else %}
    <p class="text-muted text-center mt-4">There are no tags yet.</p>
  {% endif %}
{% endblock %}
