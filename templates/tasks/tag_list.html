{% extends "base.html" %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mt-3 mb-4">
    <h1>Tags</h1>

    <a href="#" class="btn btn-primary">Create tag</a>
  </div>

  {% if tag_list %}
    <table class="table table-hover shadow-sm bg-white rounded">
      <thead class="thead-light">
      <tr>
        <th>Name</th>
        <th class="text-right pr-5">Actions</th>
      </tr>
      </thead>
      <tbody>
      {% for tag in tag_list %}
        <tr>
          <td class="align-middle font-weight-bold text-secondary">
            {{ tag.name }}
          </td>
          <td class="text-right align-middle">

            <a href="#" class="btn btn-sm btn-outline-primary mr-2">Update</a>
            <a href="#" class="btn btn-sm btn-outline-danger mr-4">Delete</a>
          </td>
        </tr>
      {% endfor %}
      </tbody>
    </table>


    {% include "includes/pagination.html" %}

  {% else %}
    <p class="text-muted text-center mt-4">There are no tags yet.</p>
  {% endif %}
{% endblock %}
