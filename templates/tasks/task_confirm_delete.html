{% extends "base.html" %}

{% block content %}
  <h1>Delete task</h1>


  <p>Are you sure you want to delete the task: <strong>{{ object.content }}</strong>?</p>

  <form action="" method="post">
    {% csrf_token %}

    <input type="submit" value="Yes, delete" class="btn btn-danger">


    <a href="{% url 'tasks:index' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
